[package]
name = "rust-service"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.52", features = ["full"] }
tokio-tungstenite = "0.29"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
futures-util = "0.3"
anyhow = "1"
url = "2"
nix = { version = "0.31", features = ["signal", "process", "fanotify", "fs"] }
libc = "0.2.186"
